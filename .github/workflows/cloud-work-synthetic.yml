name: Public synthetic cloud-worker CI

on:
  push:
    branches:
      - cloud-work/synthetic-ci-v1
    paths:
      - .github/workflows/cloud-work-synthetic.yml
      - cloud-worker/**

permissions:
  contents: read

jobs:
  worker-ci:
    if: ${{ github.event_name == 'push' && toJSON(github.event.repository.private) == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out the software under test
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test the synthetic worker
        run: python3 -I -B cloud-worker/test_worker.py
      - name: Verify a sample receipt
        shell: bash
        run: |
          set -euo pipefail
          CLOUD_WORK_REQUEST_ID="${GITHUB_SHA:0:32}"
          python3 -I -B cloud-worker/worker.py --request-id "$CLOUD_WORK_REQUEST_ID" | tee -a "$GITHUB_STEP_SUMMARY"
